name: Release build

on:
  push:
    tags:
      - "v*"
  # Build, package and prove the update helper without tagging or releasing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      # build.ps1 runs PyInstaller from the project environment.
      - name: Project environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements.lock.txt
          .venv/Scripts/python.exe -m pip install -e .

      # Before anything is built, so a mistyped tag fails in seconds and not in minutes.
      - name: Validate the version against the tag
        run: .venv/Scripts/python.exe packaging/check_release_version.py

      - name: Offline checks
        run: .venv/Scripts/python.exe -m pytest tests/test_core.py tests/test_engine.py tests/test_bridge.py tests/test_browser_setup.py tests/test_ring_editor.py tests/test_settings_layout.py tests/test_clipboard.py tests/test_windows_worker.py tests/test_translation.py tests/test_region.py tests/test_updates.py tests/test_package_release.py src/desktop_ai_assistant/shared/desktop/autoupdate/tests -q

      - name: Extension build and tests
        working-directory: browser-extension
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          exit $LASTEXITCODE

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1

      # Preinstalled on the runner image; installed only when an image lacks it.
      - name: Inno Setup compiler
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package the zip and the Setup
        run: .venv/Scripts/python.exe packaging/package_release.py

      # The one-file DesktopAiHost.exe of the new build swaps the program folder, so the real
      # build has to swap a scratch copy in helper mode before it is released.
      - name: Prove the update helper on the built folder
        run: .venv/Scripts/python.exe -m desktop_ai_assistant.shared.desktop.autoupdate.verify folder dist/DesktopAiAssistant --executable DesktopAiAssistant.exe --helper DesktopAiHost.exe --scratch "${{ runner.temp }}"

      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ai-assistant-win
          path: |
            dist/release/*.zip
            dist/release/*.exe
          if-no-files-found: error

  release:
    name: create the draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Compute the checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.zip' \) | sort | while read -r file; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
          done > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          cat SHA256SUMS.txt

      # actions/checkout does not keep annotated tag objects, so the tag is fetched again to
      # read the summary that the release script wrote into it.
      - name: Read the release summary from the annotated tag
        run: |
          git fetch --depth=1 --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" \
            | sed "1s/^${GITHUB_REF_NAME} - //" > summary.md
          test -s summary.md
          cat summary.md

      # The application shows the notes up to the marker; installation and the download check
      # below stay on the release page.
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            cat summary.md
            echo
            echo '<!-- update-notes-end -->'
            echo
            echo '### Install'
            echo
            echo "Run \`DesktopAiAssistant-Setup-${version}-x64.exe\`. It installs for the current Windows user,"
            echo 'without administrator rights, into `%LOCALAPPDATA%\Programs\DesktopAiAssistant` and adds a'
            echo 'Start Menu shortcut. The builds are unsigned: Windows SmartScreen warns about an unknown'
            echo 'publisher; choose **More info**, then **Run anyway**. Settings and history stay when you'
            echo 'uninstall.'
            echo
            echo "An installed copy updates itself: it downloads \`DesktopAiAssistant-${version}-win-x64.zip\`,"
            echo 'checks it against SHA256SUMS.txt and installs it on restart or on the next quit. The zip also'
            echo 'runs unpacked from any writable folder.'
            echo
            echo '### Verify your download'
            echo
            echo 'Check the SHA256 of your download before running it.'
            echo
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - name: Create the draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          body_path: release-notes.md
          files: artifacts/**/*
