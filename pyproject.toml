[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-ai-assistant"
dynamic = ["version"]
description = "A Windows action ring with AI text editing, profiles and macros"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6==6.11.2", "pywin32==312; sys_platform == 'win32'", "comtypes==1.4.17; sys_platform == 'win32'", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller==6.20.0"]

[project.scripts]
desktop-ai-assistant = "desktop_ai_assistant.app:main"

[tool.setuptools.dynamic]
version = { attr = "desktop_ai_assistant.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop_ai_assistant = ["qml/*.qml", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
